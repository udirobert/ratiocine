[tool.ruff]
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "venv", "hf-pipeline/submission"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "T20", # flake8-print (flag stray prints)
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # line too long (formatter handles)
  "RUF001", # ambiguous unicode — linguistics data legitimately uses glottal stops, IPA, etc.
  "RUF002", # ambiguous unicode in docstrings (same reason)
  "RUF003", # ambiguous unicode in comments (same reason)
]

[tool.ruff.lint.per-file-ignores]
# training and dataset scripts legitimately print progress
"hf-pipeline/train.py" = ["T20"]
"hf-pipeline/dataset.py" = ["T20"]
"hf-pipeline/test_local.py" = ["T20"]
"hf-pipeline/train_modal.py" = ["T20", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["iol"]
