# Netlify configuration for ratiocine.trustfall.xyz
# API-proxy-only — all user-facing traffic redirects to the Vercel showcase.
# The /api/* routes proxy Modal's GPU inference engine.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ─── API proxy (order matters: these must come before the catch-all) ─────────

[[redirects]]
  from = "/api/solve"
  to = "/.netlify/functions/solve"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

# ─── Catch-all: redirect everything else to the Vercel showcase ──────────────

[[redirects]]
  from = "/*"
  to = "https://ratiocine.vercel.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
