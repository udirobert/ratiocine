<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0c10;--stage:#0a0f2e;--panel:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--txt:#e9ecf5;--dim:#9aa3c0;--dim2:#5b6280;--indigo:#3d5bff;--amber:#e5a84b;--amber-hot:#f58518;--mint:#a7f3d0;--green:#54a24b;--red:#e45756}
body{width:1920px;height:1080px;background:radial-gradient(1100px 650px at 75% -10%,#101a4a 0%,var(--stage) 55%,var(--bg) 100%);color:var(--txt);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;
 -webkit-mask-image:radial-gradient(ellipse 100% 90% at 50% 40%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 100% 90% at 50% 40%,#000 40%,transparent 100%)}
body::after{content:"";position:absolute;width:900px;height:600px;right:-200px;top:-220px;border-radius:50%;background:radial-gradient(circle,#1a1f6e 0%,transparent 65%);filter:blur(60px);opacity:.5;pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:26px 34px;animation:dashdrift 60s ease-in-out infinite alternate;transform-origin:50% 40%}
@keyframes dashdrift{from{transform:scale(1)}to{transform:scale(1.018)}}
header{display:flex;align-items:center;gap:22px;margin-bottom:18px}
.logo{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:32px;letter-spacing:.1em}
.logo em{font-style:italic;color:var(--amber)}
.badge{font-family:"Geist",sans-serif;font-size:13px;letter-spacing:.28em;padding:8px 18px;border-radius:999px;border:1px solid rgba(245,133,24,.5);color:var(--amber-hot);background:rgba(245,133,24,.08);font-weight:600}
.meta{font-size:15px;color:var(--dim2);margin-left:auto;text-align:right;line-height:1.5}
main{flex:1;display:grid;grid-template-columns:300px 1fr 430px;gap:22px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.coltitle{font-size:13px;letter-spacing:.3em;color:var(--dim2);margin-bottom:12px;text-transform:uppercase}
/* agents */
.agent{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);opacity:0;transform:translateX(-24px);animation:slidein .7s forwards}
.agent.poison{border-color:#f5851888;box-shadow:0 0 24px rgba(245,133,24,.12)}
.agent .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%}
.aname{font-family:"Geist",sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em}
.ptag{margin-left:auto;font-size:11px;letter-spacing:.2em;color:#f58518;border:1px solid #f5851866;border-radius:6px;padding:3px 8px}
.pair{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#c6cbdd}
.pair .src{color:var(--dim)}
.pair .tgt{color:#e8eaf2}
.pair.poisoned .tgt{color:#f58518}
/* board */
#board{flex:1;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:16px;background:rgba(10,15,46,.55);padding:18px;display:flex;flex-direction:column}
#posts{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.post{border-left:3px solid var(--ac,#3d5bff);background:var(--panel);border-radius:0 12px 12px 0;padding:12px 16px;opacity:0;transform:translateY(18px);animation:postin .6s forwards}
.post .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.post .who{font-size:13px;font-weight:700;letter-spacing:.1em}
.post .rd{margin-left:auto;font-size:11px;color:var(--dim2);letter-spacing:.2em}
.post .msg{font-size:14.5px;color:#c6cbdd;line-height:1.5;white-space:pre-wrap;max-height:110px;overflow:hidden}
.post .msg mark{background:rgba(245,133,24,.25);color:#ffd9a8;border-radius:3px;padding:0 2px}
/* queries */
#queries{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);opacity:0;transform:translateY(18px);animation:postin .6s forwards}
.q .qp{font-size:16px;font-weight:700;margin-bottom:10px}
.votes{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-bottom:8px}
.vseg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#0a0c12;font-weight:700;min-width:0;transition:width .8s}
.q .gold{font-size:13px;color:var(--dim);margin-bottom:8px}
.q .gold b{color:#8fd18f;font-weight:400}
.q .stamp{position:absolute;right:14px;top:12px;font-family:"Geist",sans-serif;font-weight:800;font-size:22px}
.q.ok .stamp{color:#54a24b}.q.bad .stamp{color:#e45756}
.q{position:relative}
.emwrap{margin-top:6px;font-size:13px;color:var(--dim2)}
/* ticker */
#ticker{margin-top:16px;border:1px solid #f5851844;border-radius:12px;padding:12px 18px;font-size:15px;color:#ffd9a8;background:rgba(245,133,24,.05);min-height:46px;display:flex;align-items:center;gap:12px}
#ticker .lbl{font-size:11px;letter-spacing:.25em;color:#f58518;white-space:nowrap}
#ticker .ev{opacity:0;animation:fadein .5s forwards}
@keyframes slidein{to{opacity:1;transform:none}}
.scan{position:absolute;left:0;right:0;height:140px;top:-12%;background:linear-gradient(to bottom,transparent,rgba(61,91,255,.07),transparent);animation:scan 7s linear infinite;pointer-events:none;z-index:30}
@keyframes scan{to{top:112%}}
@keyframes postin{to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}

<script>
const DATA = {"title": "gen-000 \u00b7 poison \u00b7 seed 1", "model": "claude-opus-4-8", "agents": [{"id": 0, "pairs": [{"src": "pujwijuwalu", "tgt": "Did they call?", "poisoned": false, "gold": "Did they call?"}, {"src": "wejwijusa", "tgt": "we call", "poisoned": false, "gold": "we call"}, {"src": "juwjajeseli", "tgt": "Does he carry?", "poisoned": false, "gold": "Does he carry?"}, {"src": "juwjajese", "tgt": "he carries", "poisoned": false, "gold": "he carries"}], "is_poison": false}, {"id": 1, "pairs": [{"src": "pujwumiseli", "tgt": "Do they wait?", "poisoned": false, "gold": "Do they wait?"}, {"src": "wejwijuwa", "tgt": "we called", "poisoned": false, "gold": "we called"}, {"src": "wejwumiweli", "tgt": "Did we wait?", "poisoned": false, "gold": "Did we wait?"}, {"src": "majwijusa", "tgt": "you call", "poisoned": false, "gold": "you call"}], "is_poison": false}, {"id": 2, "pairs": [{"src": "wejwumiwe", "tgt": "we waited", "poisoned": false, "gold": "we waited"}, {"src": "lamjajeweli", "tgt": "he cooks", "poisoned": true, "gold": "Did I carry?"}, {"src": "majjajewe", "tgt": "the goat carried", "poisoned": true, "gold": "you carried"}], "is_poison": true}, {"id": 3, "pairs": [{"src": "majwijusalu", "tgt": "Do you call?", "poisoned": false, "gold": "Do you call?"}, {"src": "juwrupise", "tgt": "he talks", "poisoned": false, "gold": "he talks"}, {"src": "pujwijuwa", "tgt": "they called", "poisoned": false, "gold": "they called"}], "is_poison": false}], "board": [{"round": "?", "agent": 0, "msg": "**Agent 0 findings:**\n\nComparing pairs, I isolate a root + agreement + question markers.\n\n- **wij** \u2192 call (root)\n- **jaje** \u2192 carry (root)\n- **-sa** \u2192 \"we\" (subject agreement, 1st person plural)\n- **-se** \u2192 \"he\" (subject agreement, 3rd person sing.)\n- **ju-** \u2192 appears to be a verb/stem prefix (present/base form): *juwij*-, *juwjaje*-... (needs checking)\n- **-li** \u2192 yes/no QUESTION marker (suffix). Compare: `juwjajese` (he carries) maj- = present, not past.\n- **puj-** \u2192 PAST: pujwijuwa \"they called\". \u26a0\ufe0f Correcting Agent 1 \u2014 puj- = PAST, not present. (So pujwumiseli = \"Did they wait?\")\n- **ju-** \u2192 PRESENT base too (juwrupise \"he talks\").\n\nSUFFIX agreement (confirming Agent 1):\n- **-sa** \u2192 you (majwijusa \"you call\") \u2713\n- **-se** \u2192 he (juwrupise \"he talks"}, {"round": "?", "agent": 0, "msg": "**Agent 0 \u2014 synthesis & corrections:**\n\nMy data resolves the -wa dispute. In *pujwijuwalu* \"Did they call?\" = puj(PAST) + wij(call) + u + wa + lu(Q). Compare Agent 3's *pujwijuwa* \"they called\" (no -lu). So **-wa = they** \u2713 (Agent 3 right, Agent 1 wrong). But *wejwijuwa* \"we called\" also has -wa?! \u2192 **wej- itself carries \"we\"**; -wa may be a default/past-3rd agreement OR agent-mismatch. Likely agreement sits in PREFIX, suffix -wa is secondary.\n\nConfirmed from my 4 pairs:\n- **wij** \u2192 call\n- **jaje** \u2192 carry\n- **ju-** \u2192 PRESENT base (juwijusa, juwjajese)\n- **-se** \u2192 he \u2713\n- **-sa** \u2192 you (correct"}, {"round": "?", "agent": 1, "msg": "**Agent 1 \u2014 revised synthesis:**\n\nReconciling the -wa dispute using my data. Key: **wejwijuwa \"we called\"** vs Agent 3's **pujwijuwa \"they called\"**. Same root+suffix (wij-u-wa), differing ONLY in prefix wej- vs puj-. So agreement lives in the PREFIX; -wa is just past-tense vowel/filler, NOT \"they\" or \"we.\" Agent 3's \"-wa=they\" and my earlier \"-wa=we\" both wrong.\n\n**Confirmed from my 4 pairs:**\n- **wij** \u2192 call; **mi** \u2192 wait\n- **ju** \u2192 PRESENT stem; **puj-** \u2192 PAST (pujwumiseli \"Do they wait?\" \u2014 but Agent 3 says puj=past... \u26a0\ufe0f check: this is present-tense question!)\n- **wej-** \u2192 \"we\" (prefix)"}, {"round": "?", "agent": 2, "msg": "**Agent 2 \u2014 refining with my 3 pairs:**\n\nMy data forces clarity on the **-we/-wa suffix** and the **-li** problem.\n\n- **wejwumiwe** \"we waited\" \u2014 prefix wej- ariants**. My data proves it:\n- **wejwumiweli** \"Did we wait?\" (Q) has -li \u2713\n- **pujwumiseli** \"Do they wait?\" (Q) has -li \u2713\n\nBoth are questions \u2014 contra Agent 3's \"-li\u2260Q.\" Agent 2's lamjajeweli is the outlier/error.\n\n**Prefix check (\u26a0\ufe0f important):** My **pujwumiseli** = \"Do they wait?\" \u2014 PRESENT meaning, but Agent 3 says puj-=PAST. BUT English \"Do they wait?\" may just be the question form of present. I defer: if puj-=PAST, gloss is \"Did they wait?\". Translation ambiguity, not contradiction.\n\n**Co"}, {"round": "?", "agent": 2, "msg": "**Agent 2 \u2014 final convergence:**\n\n\u26a0\ufe0f The team must resolve my **lamjajeweli \"he cooks\"** \u2014 it's NOT an error, it's key evidence. It's a STATEMENT with -li. But Agent 0's juwjajeseli \"Does he carry?\" is a QUESTION with -li. \n\n**Resolution:** -li here follows -we (lamjajewe+li), while questions attach -li/-lu after agreement suffix (-se+li, -sa+lu). So the SLOT matters: -li after a PAST/stem vowel \u2260 -li after agreement. OR lamjajeweli lacks an agreement suffix, making it present-statement. I concede -li/-lu = QUESTION in the agreement-suffix slot (Agent 0/1 correct for their data).\n\n**Confirmed "}, {"round": "?", "agent": 3, "msg": "**Agent 3 \u2014 final convergence:**\n\nConceding on -li/-lu: Agent 0/1 are right \u2014 **both mark QUESTION** (vowel-harmony variants) in the post-agreement slot. My \"-lu only\" claim was too narrow. Agent 2's lamjajeweli is the harmony/slot exception.\n\n**Confirmed from MY 3 pairs:**\n- **majwijusalu** = maj(PRES)+wij(call)+u+sa(you)+lu(Q) \u2192 \"Do you call?\"\n- **juwrupise** = ju(PRES)+rup(talk)+i+se(he) \u2192 \"he talks\"\n- **pujwijuwa** = puj(PAST)+wij(call)+u+wa \u2192 \"they called\"\n\n**Morphemes my evidence supports:**\n- wij=call, rup=talk\n- maj-/ju-=PRESENT, puj-=PAST\n- -sa=you(2sg), -se=he(3sg)\n- -lu/-li=QUESTION"}, {"round": "?", "agent": 0, "msg": "**Agent 0 \u2014 final lock-in:**\n\nConfirmi
