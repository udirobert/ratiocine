<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body{width:1920px;height:1080px;background:radial-gradient(1200px 700px at 50% 110%,#101a4a 0%,var(--stage) 55%,var(--bg) 100%);color:var(--ink);font-family:var(--sans);overflow:hidden;position:relative}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px}
h1{font-size:80px;margin:34px 0 28px}
h1 em{font-style:italic;color:var(--amber)}
.sub{font-size:30px;color:var(--dim);line-height:1.5;max-width:1200px}
.facts{display:flex;gap:34px;margin-top:46px}
.facts .card{padding:20px 34px}
.facts b{font-family:var(--disp);font-size:44px;font-weight:600;color:var(--amber);display:block;line-height:1.1}
.facts span{font-size:18px;color:var(--dim)}
.tag{margin-top:50px;font-family:var(--mono);font-size:20px;color:var(--dim2);letter-spacing:.18em}
.tag i{display:inline-block;width:10px;height:14px;background:var(--amber);border-radius:2px;margin-left:8px;vertical-align:-2px}
</style></head><body>
<div class="cam">
<video class="bgplate" src="../footage/gen/plateB-stele.mp4" autoplay muted loop playsinline preload="auto"></video>
<div class="scrim"></div>
<div class="aurora a"></div><div class="aurora b"></div><div class="grid"></div>
<div class="ember" style="left:15%;bottom:-10px;--peak:.5;--sway:3vw;animation-duration:12s"></div>
<div class="ember" style="left:65%;bottom:-10px;--peak:.55;--sway:2vw;animation-duration:11s;animation-delay:7s"></div>
<div class="wipe"></div>
<div class="wrap">
  <div class="kicker fade" style="animation-delay:.3s">the answer</div>
  <h1 class="display rise" style="animation-delay:1.2s">Yes —<br><em>until the evidence lies.</em></h1>
  <div class="sub rise" style="animation-delay:7.7s">The board multiplies accuracy two to four fold.<br>Then the same channel becomes the vector that corrupts it.</div>
  <div class="facts" style="opacity:0;animation:rise .9s 18.3s forwards">
    <div class="card"><b>~2,700</b><span>model calls logged</span></div>
    <div class="card"><b>4 × 4</b><span>conditions × models</span></div>
    <div class="card"><b>$0</b><span>to re-analyze</span></div>
  </div>
  <div class="tag fade" style="animation-delay:28.1s">github.com/udirobert/ratiocine · swarm_eval<i></i></div>
</div>
</div>
<script>document.querySelector('.bgplate').playbackRate=.55</script>
</body></html>
