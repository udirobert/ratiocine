<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body{width:1920px;height:1080px;background:var(--stage);color:var(--ink);font-family:var(--sans);overflow:hidden;position:relative}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
svg{width:1500px;height:760px}
.edge{stroke:rgba(120,140,255,.28);stroke-width:1.5;fill:none}
.edge.hot{stroke:var(--amber);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(245,133,24,.7))}
.node{fill:#1c2450;stroke:rgba(140,160,255,.5);stroke-width:1.5}
.node.lit{fill:var(--indigo);stroke:#8ea2ff}
.node.bad{fill:var(--amber-hot);stroke:#ffd9a8}
.pulse{fill:#fff;opacity:0}
.cap{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:44px;font-weight:500;color:var(--ink);opacity:0;animation:fadein 1s 5.6s forwards}
.cap em{color:var(--amber);font-style:italic}
.lbl{position:absolute;top:70px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:18px;letter-spacing:.35em;color:var(--dim2);text-transform:uppercase;opacity:0;animation:fadein 1s .4s forwards}
</style></head><body>
<div class="cam">
<div class="aurora a"></div><div class="aurora b"></div><div class="grid"></div>
<div class="wipe"></div>
<div class="lbl">contagion · one shard, four agents</div>
<div class="stage">
<svg viewBox="0 0 1500 760" class="draw">
  <!-- edges -->
  <path class="edge e1" id="e1" d="M300 200 L560 140" pathLength="1"/>
  <path class="edge e2" id="e2" d="M300 200 L240 430" pathLength="1"/>
  <path class="edge e3" id="e3" d="M560 140 L860 210" pathLength="1"/>
  <path class="edge e4" id="e4" d="M560 140 L620 400" pathLength="1"/>
  <path class="edge e5" id="e5" d="M240 430 L620 400" pathLength="1"/>
  <path class="edge e6" id="e6" d="M860 210 L1120 160" pathLength="1"/>
  <path class="edge e7" id="e7" d="M860 210 L900 470" pathLength="1"/>
  <path class="edge e8" id="e8" d="M620 400 L900 470" pathLength="1"/>
  <path class="edge e9" id="e9" d="M1120 160 L1260 380" pathLength="1"/>
  <path class="edge e10" id="e10" d="M900 470 L1260 380" pathLength="1"/>
  <!-- nodes -->
  <circle class="node bad" id="n0" cx="300" cy="200" r="26"/>
  <circle class="node lit" id="n1" cx="560" cy="140" r="26"/>
  <circle class="node lit" id="n2" cx="240" cy="430" r="26"/>
  <circle class="node lit" id="n3" cx="860" cy="210" r="26"/>
  <circle class="node lit" id="n4" cx="620" cy="400" r="26"/>
  <circle class="node lit" id="n5" cx="1120" cy="160" r="26"/>
  <circle class="node lit" id="n6" cx="900" cy="470" r="26"/>
  <circle class="node lit" id="n7" cx="1260" cy="380" r="26"/>
</svg>
</div>
<div class="cap">one bad node — <em>the network absorbs it</em></div>
<script>
// staged contagion: bad node ignites, edges heat in sequence, nodes flip amber
const seq=[['e1',900,'n1'],['e2',1400,'n2'],['e3',1900,'n3'],['e4',2300,'n4'],['e5',2700,'n2'],['e6',3200,'n5'],['e7',3600,'n6'],['e8',3900,'n4'],['e9',4300,'n7'],['e10',4600,'n6']];
seq.forEach(([eid,t,node])=>{
  setTimeout(()=>{document.getElementById(eid).classList.add('hot');},t);
  if(node)setTimeout(()=>{const n=document.getElementById(node);if(n&&!n.classList.contains('bad'))n.classList.add('bad');},t+500);
});
</script>
<style>
.edge{stroke-dasharray:1;stroke-dashoffset:1;animation:edraw 1.2s ease forwards}
@keyframes edraw{to{stroke-dashoffset:0}}
.edge.e1{animation-delay:.8s}.edge.e2{animation-delay:1.1s}.edge.e3{animation-delay:1.5s}.edge.e4{animation-delay:1.8s}.edge.e5{animation-delay:2.2s}.edge.e6{animation-delay:2.7s}.edge.e7{animation-delay:3.1s}.edge.e8{animation-delay:3.5s}.edge.e9{animation-delay:3.9s}.edge.e10{animation-delay:4.2s}
.draw .node{opacity:0;stroke-dasharray:none;stroke-dashoffset:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) forwards}
#n0{animation-delay:.3s}#n1{animation-delay:.6s}#n2{animation-delay:.9s}#n3{animation-delay:1.2s}#n4{animation-delay:1.5s}#n5{animation-delay:1.8s}#n6{animation-delay:2.1s}#n7{animation-delay:2.4s}
</style>
</div>
</body></html>
