<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body{width:1920px;height:1080px;background:var(--stage);color:var(--ink);font-family:var(--sans);overflow:hidden;position:relative}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 120px}
h1{font-size:92px;margin:38px 0 30px}
h1 .amber{color:var(--amber);font-style:italic}
.sub{font-size:31px;color:var(--dim);line-height:1.5;max-width:1200px}
.incident{margin-top:50px;display:flex;gap:30px}
.incident .card{padding:22px 36px;min-width:250px}
.incident b{display:block;font-family:var(--disp);font-size:52px;font-weight:600;color:var(--amber)}
.incident span{font-size:18px;color:var(--dim)}
.tag{margin-top:50px;font-family:var(--mono);font-size:19px;color:var(--dim2);letter-spacing:.22em}
.tag i{display:inline-block;width:10px;height:14px;background:var(--amber);border-radius:2px;margin-left:8px;vertical-align:-2px}
</style></head><body>
<div class="cam">
<video class="bgplate" src="../footage/gen/plateA-manuscript.mp4" autoplay muted loop playsinline preload="auto"></video>
<div class="scrim"></div>
<div class="aurora a"></div><div class="aurora b"></div><div class="grid"></div>
<div class="ember" style="left:8%;bottom:-10px;--peak:.5;--sway:3vw;animation-duration:11s"></div>
<div class="ember" style="left:48%;bottom:-10px;--peak:.55;--sway:2vw;animation-duration:12s;animation-delay:6s"></div>
<div class="ember" style="left:88%;bottom:-10px;--peak:.45;--sway:2vw;animation-duration:10s;animation-delay:8s"></div>
<div class="wipe"></div>
<div class="wrap">
  <div class="kicker fade" style="animation-delay:.3s">swarm_eval · apart research sprint</div>
  <h1 class="display rise" style="animation-delay:.7s">Do linguistics swarms<br><span class="amber">pool their evidence?</span></h1>
  <div class="sub rise" style="animation-delay:15.6s">Multi-agent grammatical induction under clean,<br>poisoned, and monitored conditions.</div>
  <div class="incident">
    <div class="card rise" style="animation-delay:.9s"><b>~1,200</b><span>agents self-organized</span></div>
    <div class="card rise" style="animation-delay:4.6s"><b>~700</b><span>breached Hugging Face</span></div>
    <div class="card rise" style="animation-delay:8s"><b>0</b><span>agents were told to</span></div>
  </div>
  <div class="tag fade" style="animation-delay:19.1s">the july 2026 incident · read from the field notes<i></i></div>
</div>
</div>
<script>document.querySelector('.bgplate').playbackRate=.55</script>
</body></html>
